{% extends "base.html" %}
{% set hide_nav = True %}
{% block title %}Sign in - PrimerForge{% endblock %}

{% block content %}
<section class="card card-pad auth-card">
  <h1>Sign in</h1>
  <p class="small dim" style="margin:0">PrimerForge on this server is shared with your group.
    Ask an administrator if you need an account.</p>
  {% if error %}<div class="note bad" style="margin-top:14px" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('page_login') }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <div>
      <label class="field" for="username">Username</label>
      <input type="text" id="username" name="username" value="{{ username }}"
             autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    </div>
    <div>
      <label class="field" for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
